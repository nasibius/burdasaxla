name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff
      - run: ruff check app tests scripts
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt playwright==1.65.1
      - run: python -m playwright install --with-deps chromium
      - run: python backend/scripts/export_static.py
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env: { VITE_STATIC: "1", VITE_BASE: "/burdasaxla/" }
      - name: Exercise driver and authority journeys at the Pages base path
        run: |
          VITE_BASE=/burdasaxla/ npm run preview --prefix frontend -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/burdasaxla/ > /dev/null; then break; fi
            sleep 1
          done
          python frontend/tests/smoke.py http://127.0.0.1:4173/burdasaxla/ work/ui-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-evidence, path: work/ui-evidence }

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx==0.28.1 pillow==13.0.0
      - run: docker build -t burdasaxla-admin-test .
      - name: Verify authenticated admin writes and persistent evidence as nonroot
        run: python backend/scripts/smoke_container.py
