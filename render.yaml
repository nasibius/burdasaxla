# One-click deploy of the full app (API + admin) on Render: https://render.com/deploy
services:
  - type: web
    name: burdasaxla
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BURDASAXLA_ADMIN_TOKEN
        generateValue: true
      # Demo: SIMULATED EXAMPLE survey coverage (labelled everywhere, never legally confirmed). Remove for real use.
      - key: BURDASAXLA_DEMO_SURVEY
        value: "1"
